<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Preparatoria en Casa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(850,200)" fill="#ffffff" fill-opacity="0.22"><rect x="20" y="20" width="110" height="110" rx="14"/><rect x="150" y="20" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="20" y="150" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="150" y="150" width="110" height="110" rx="14"/></g>
  <text x="80" y="100" font-family="monospace" font-size="15" fill="#ffffff" fill-opacity="0.72" letter-spacing="2">DEMO-READY</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Preparatoria en Casa</text>
  <text x="80" y="334" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">A full school year for my five-year-old son,</text>
  <text x="80" y="372" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">taught at home in Quito and mapped week by week</text>
  <text x="80" y="410" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">to Ecuador&#x27;s official curriculum, with a script</text>
  <text x="80" y="448" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">that proves all 151 required skills are covered.</text>
  <g transform="translate(80, 540)"><rect width="158" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="79.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">education</text></g>
  <g transform="translate(250, 540)"><rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="86.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">curriculum</text></g>
  <g transform="translate(434, 540)"><rect width="116" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="58.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">family</text></g>
  <g transform="translate(562, 540)"><rect width="200" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="100.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">verification</text></g>
  <text x="1120" y="600" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.55" text-anchor="end">built with Claude Code</text>
</svg>
