<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Wedding Planner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(850,200)" fill="#ffffff" fill-opacity="0.22"><rect x="20" y="20" width="110" height="110" rx="14"/><rect x="150" y="20" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="20" y="150" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="150" y="150" width="110" height="110" rx="14"/></g>
  <text x="80" y="100" font-family="monospace" font-size="15" fill="#ffffff" fill-opacity="0.72" letter-spacing="2">DEMO-READY</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Wedding Planner</text>
  <text x="80" y="334" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">Our wedding, run from one database: guests RSVP</text>
  <text x="80" y="372" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">and sign the guestbook on a free static site, we</text>
  <text x="80" y="410" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">track budget and vendors in planning tables, and</text>
  <text x="80" y="448" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">the ceremony script lives on a web page.</text>
  <g transform="translate(80, 540)"><rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="65.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">wedding</text></g>
  <g transform="translate(222, 540)"><rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="86.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">full-stack</text></g>
  <g transform="translate(406, 540)"><rect width="102" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="51.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">astro</text></g>
  <g transform="translate(520, 540)"><rect width="144" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="72.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">supabase</text></g>
  <text x="1120" y="600" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.55" text-anchor="end">built with Claude Code</text>
</svg>
