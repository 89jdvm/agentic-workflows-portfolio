<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="openfrom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(850,200)" fill="#ffffff" fill-opacity="0.22"><rect x="20" y="20" width="110" height="110" rx="14"/><rect x="150" y="20" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="20" y="150" width="110" height="110" rx="14" fill-opacity="0.35"/><rect x="150" y="150" width="110" height="110" rx="14"/></g>
  <text x="80" y="100" font-family="monospace" font-size="15" fill="#ffffff" fill-opacity="0.72" letter-spacing="2">DEMO-READY</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="#ffffff">openfrom</text>
  <text x="80" y="334" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">A free web tool that shows remote jobs you can</text>
  <text x="80" y="372" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">actually take from the country you live in,</text>
  <text x="80" y="410" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">matched to your CV inside your browser.</text>
  <g transform="translate(80, 540)"><rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="65.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">web-app</text></g>
  <g transform="translate(222, 540)"><rect width="186" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="93.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">ai-matching</text></g>
  <g transform="translate(420, 540)"><rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="86.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">job-search</text></g>
  <g transform="translate(604, 540)"><rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="65.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">privacy</text></g>
  <text x="1120" y="600" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.55" text-anchor="end">built with Claude Code</text>
</svg>
