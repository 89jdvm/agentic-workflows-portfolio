<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Forest Knight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(840,200)" fill="#ffffff" fill-opacity="0.22"><rect x="130" y="40" width="40" height="220" rx="6"/><rect x="40" y="130" width="220" height="40" rx="6"/><circle cx="150" cy="150" r="18" fill-opacity="0.4"/></g>
  <text x="80" y="100" font-family="monospace" font-size="15" fill="#ffffff" fill-opacity="0.72" letter-spacing="2">DEMO-READY</text>
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Forest Knight</text>
  <text x="80" y="334" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">A side-scrolling mobile game I built with my 4-year-</text>
  <text x="80" y="372" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">old son — he designed the bosses, I wrote the</text>
  <text x="80" y="410" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">prompts, and we edited the game together every time</text>
  <text x="80" y="448" font-family="-apple-system, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.88">we played it.</text>
  <g transform="translate(80, 540)"><rect width="144" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="72.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">creative</text></g>
  <g transform="translate(236, 540)"><rect width="144" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="72.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">game-dev</text></g>
  <g transform="translate(392, 540)"><rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="86.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">father-son</text></g>
  <g transform="translate(576, 540)"><rect width="186" height="38" rx="19" fill="#ffffff" fill-opacity="0.18"/><text x="93.0" y="25" font-family="monospace" font-size="15" fill="#ffffff" text-anchor="middle">vibe-coding</text></g>
  <text x="1120" y="600" font-family="monospace" font-size="14" fill="#ffffff" fill-opacity="0.55" text-anchor="end">built with Claude Code</text>
</svg>
